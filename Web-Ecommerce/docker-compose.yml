# =============================================================================
#  Ecommerce — Docker Compose (Microservices)
#  MySQL 8.0 + Redis 7 + Gateway + 3 Services + 2 Frontends
# =============================================================================

services:

  # ====== Data Layer ======

  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ecommerce_user
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    networks:
      - ecommerce-net

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  # ====== Microservices ======

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: ecommerce-user-service
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-net

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: ecommerce-product-service
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_product?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
    volumes:
      - upload-data:/app/upload
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-net

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: ecommerce-order-service
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecommerce-net

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: ecommerce-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - ecommerce-net

  # ====== Frontends ======

  client-frontend:
    build:
      context: ./Front
      dockerfile: client/Dockerfile
    container_name: ecommerce-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway
    networks:
      - ecommerce-net

  admin-frontend:
    build:
      context: ./Front
      dockerfile: admin/Dockerfile
    container_name: ecommerce-admin
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - gateway
    networks:
      - ecommerce-net

# ====== Volumes ======

volumes:
  mysql-data:
    name: ecommerce-mysql-data
  redis-data:
    name: ecommerce-redis-data
  upload-data:
    name: ecommerce-upload-data

# ====== Network ======

networks:
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
