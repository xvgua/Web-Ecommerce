# =============================================================================
#  电商平台 — Docker Compose 部署
#  数据层（独立容器）：MySQL 8.0 + Redis 7
#  应用层：Spring Boot Backend
#  前端：本地 Vite 开发服务器（不在此 Compose 中）
# =============================================================================

version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# 数据层（独立数据库容器，Volume 持久化，不随应用重启丢失）
# ─────────────────────────────────────────────────────────────────────────────
services:

  # 独立数据库容器 — MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ecommerce
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 独立数据卷 — docker compose down 不会删除（除非加 -v）
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行 init.sql 初始化库表 + 种子数据
      - ./Back/src/main/resources/sql:/docker-entrypoint-initdb.d
      # MySQL 自定义配置
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --default-authentication-plugin=mysql_native_password
    networks:
      - ecommerce-net

  # 独立缓存容器 — Redis 7
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-net

  # ───────────────────────────────────────────────────────────────────────────
  # 应用层
  # ───────────────────────────────────────────────────────────────────────────

  backend:
    build: ./Back
    container_name: ecommerce-backend
    restart: always
    ports:
      - "8081:8080"
    environment:
      TZ: Asia/Shanghai
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      JAVA_OPTS: -Duser.timezone=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload-data:/app/upload
    networks:
      - ecommerce-net

# ─────────────────────────────────────────────────────────────────────────────
# 独立数据卷（数据库和上传文件独立存储）
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  mysql-data:
    name: ecommerce-mysql-data
  redis-data:
    name: ecommerce-redis-data
  upload-data:
    name: ecommerce-upload-data

# ─────────────────────────────────────────────────────────────────────────────
# 内部网络
# ─────────────────────────────────────────────────────────────────────────────
networks:
  ecommerce-net:
    name: ecommerce-net
    driver: bridge
